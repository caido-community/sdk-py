[project]
name = "caido-sdk-client"
version = "0.3.1"
description = "Client SDK for interacting with a Caido instance"
readme = "README.md"
authors = [{ name = "Caido Labs Inc.", email = "dev@caido.io" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "caido-server-auth>=0.1.2",
  "gql[aiohttp,websockets]>=3.5.0",
  "pydantic>=2.11.0",
  "semver>=3.0.4",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
schema-latest = ["caido-schema-proxy>=0.57.0"]
schema-v0-56 = ["caido-schema-proxy==0.56.0"]

[tool.uv]
conflicts = [[{ group = "schema-latest" }, { group = "schema-v0-56" }]]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = [
  "tests",
  "src/caido_sdk_client/graphql/tests",
  "src/caido_sdk_client/errors/tests",
  "src/caido_sdk_client/sdks/tests",
]
# Run tests one at a time (no parallel workers); integration tests share one Caido instance
addopts = ["-p", "no:xdist"]

[tool.uv.build-backend]
# Co-located unit tests live under */tests/; omit from wheels (sdist keeps them for pytest).
wheel-exclude = ["tests"]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
