[project]
name = "caido-sdk-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
caido-server-auth = { workspace = true }
# Fork includes fixes on top of upstream turms; see https://github.com/caido/dependency-turms/tree/caido
turms = { git = "https://github.com/caido/dependency-turms.git", branch = "caido" }

[dependency-groups]
dev = [
  "ruff==0.15.5",
  "turms>=1.0.1",
  "ty==0.0.22",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]


[tool.ty.src]
exclude = ["**/__generated__/**"]
